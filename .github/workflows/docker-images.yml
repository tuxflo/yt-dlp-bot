name: Docker images

# Builds the three service images and publishes them to the GitHub Container
# Registry (ghcr.io), so they can be pulled instead of built locally.
#
# The build mirrors the local one documented in the README: the shared
# 'yt-base-image' is built first, then every service image is built 'FROM' it.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image name and tags
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          # Image names must be lowercase, repository owners not necessarily are.
          prefix="${REGISTRY}/$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          tags="sha-$(git rev-parse --short HEAD)"
          if [ "${REF_TYPE}" = 'tag' ]; then
            # 'v1.8.0' is published as '1.8.0' and as 'latest'.
            tags="${tags} ${REF_NAME#v} latest"
          elif [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            tags="${tags} latest"
          else
            # Slashes are not allowed in tags: 'feat/x' becomes 'feat-x'.
            tags="${tags} $(printf '%s' "${REF_NAME}" | tr '/' '-')"
          fi

          echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${prefix}/{api,bot,worker} with tags: ${tags}"

      - name: Build the shared base image
        run: docker build --file base.Dockerfile --tag yt-base-image .

      - name: Build and push the service images
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          for service in api bot worker; do
            image="${PREFIX}/${service}"

            tag_args=''
            for tag in ${TAGS}; do
              tag_args="${tag_args} --tag ${image}:${tag}"
            done

            echo "::group::Build ${image}"
            # shellcheck disable=SC2086
            docker build --file "app_${service}/Dockerfile" ${tag_args} .
            echo "::endgroup::"

            echo "::group::Push ${image}"
            docker push --all-tags "${image}"
            echo "::endgroup::"
          done

      - name: Summary
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Published images'
            echo
            for service in api bot worker; do
              echo "- \`${PREFIX}/${service}\`"
            done
            echo
            echo "Tags: \`$(printf '%s' "${TAGS}" | tr ' ' ',')\`"
          } >> "$GITHUB_STEP_SUMMARY"
